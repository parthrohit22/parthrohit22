<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Parth Rohit - Software Engineer</title>
  <desc id="desc">A professional engineering profile banner for Parth Rohit highlighting software engineering, backend systems, cloud platforms, and distributed systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1418"/>
      <stop offset="0.58" stop-color="#121A21"/>
      <stop offset="1" stop-color="#1A1F1A"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="70" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#E5E7EB" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>

  <path d="M0 300H1200" stroke="#FFFFFF" stroke-opacity="0.055"/>
