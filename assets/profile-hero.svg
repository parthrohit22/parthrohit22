<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Parth Rohit profile banner</title>
  <desc id="desc">Clean technical profile banner for Parth Rohit, Backend and Full-Stack Software Engineer, highlighting APIs, real-time systems, data workflows, TypeScript, Python, and London.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B2033"/>
      <stop offset="1" stop-color="#0D3E47"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C7F9FF" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#background)"/>
  <rect width="1000" height="300" rx="24" fill="url(#grid)"/>

  <circle cx="865" cy="70" r="82" fill="#2563EB" fill-opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="760" cy="235" r="72" fill="#14B8A6" fill-opacity="0.14" filter="url(#softGlow)"/>

  <path d="M60 238H548" stroke="#94A3B8" stroke-opacity="0.16"/>
  <path d="M60 62H560" stroke="#2DD4BF" stroke-opacity="0.28"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="60" y="101" fill="#F8FAFC" font-size="48" font-weight="700">Parth Rohit</text>
    <text x="62" y="140" fill="#7DD3FC" font-size="25" font-weight="600">Backend &amp; Full-Stack Software Engineer</text>
    <text x="62" y="184" fill="#DCEBEE" font-size="21">Building APIs, real-time systems, and data workflows using TypeScript and Python.</text>
    <text x="62" y="223" fill="#A7B8C4" font-size="17">Final-year BSc (Hons) Computing Systems | Dean’s List | London</text>
  </g>

  <g transform="translate(600 72)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g stroke="#67E8F9" stroke-opacity="0.42" stroke-width="1.5" stroke-linecap="round">
      <path d="M62 21H74"/>
      <path d="M136 21H148"/>
      <path d="M210 21H222"/>
      <path d="M284 21H296"/>
    </g>

    <g fill="#091827" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2">
      <rect x="0" y="0" width="62" height="42" rx="10"/>
      <rect x="74" y="0" width="62" height="42" rx="10"/>
      <rect x="148" y="0" width="62" height="42" rx="10"/>
      <rect x="222" y="0" width="62" height="42" rx="10"/>
      <rect x="296" y="0" width="62" height="42" rx="10"/>
    </g>

    <g fill="#DFFAFE" font-size="10.5" font-weight="700" text-anchor="middle">
      <text x="31" y="25">CLIENT</text>
      <text x="105" y="25">API</text>
      <text x="179" y="25">SERVICES</text>
      <text x="253" y="25">DATA</text>
      <text x="327" y="25">STORAGE</text>
    </g>
  </g>
</svg>
