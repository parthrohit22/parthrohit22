      <text x="163" y="20" fill="#DDF5FF" font-size="13" font-weight="700" text-anchor="middle">Cloud runtimes</text>
      <text x="316" y="20" fill="#FFF1C2" font-size="13" font-weight="700" text-anchor="middle">Distributed state</text>
      <text x="462" y="20" fill="#ECFCCB" font-size="13" font-weight="700" text-anchor="middle">Open source</text>
