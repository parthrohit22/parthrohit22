    <text x="72" y="181" fill="#2DD4BF" font-size="30" font-weight="700">Software Engineer</text>
    <text x="72" y="223" fill="#E2E8F0" font-size="26" font-weight="650">Backend • Cloud • Distributed Systems</text>
    <text x="72" y="264" fill="#B7C3CC" font-size="18">APIs, cloud runtimes, distributed state, and platform tooling.</text>

    <g transform="translate(70 292)">
