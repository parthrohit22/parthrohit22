<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Parth Rohit - Software Engineer</title>
  <desc id="desc">A light editorial engineering banner for Parth Rohit, positioning him as a software engineer focused on backend, cloud, and distributed systems.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFCFF"/>
      <stop offset="0.55" stop-color="#F6F8FC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>

    <radialGradient id="washBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 62) rotate(142) scale(520 260)">
      <stop stop-color="#BFDBFE" stop-opacity="0.82"/>
      <stop offset="0.48" stop-color="#DBEAFE" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="washCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 310) rotate(-24) scale(410 190)">
      <stop stop-color="#CCFBF1" stop-opacity="0.78"/>
      <stop offset="0.58" stop-color="#E0F2FE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="72" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="stackTop" x1="706" y1="86" x2="1068" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#64748B" fill-opacity="0.12"/>
    </pattern>

    <filter id="softShadow" x="-18%" y="-24%" width="136%" height="152%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1E293B" flood-opacity="0.14"/>
    </filter>

    <filter id="cardShadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#paper)"/>
  <rect width="1200" height="360" rx="30" fill="url(#washBlue)"/>
  <rect width="1200" height="360" rx="30" fill="url(#washCyan)"/>
  <rect x="632" y="0" width="568" height="360" fill="url(#dotGrid)" opacity="0.7"/>

  <path d="M72 78H534" stroke="url(#rule)" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 296H548" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M72 316H436" stroke="#E2E8F0" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="72" y="139" fill="#0F172A" font-size="64" font-weight="780" letter-spacing="0">Parth Rohit</text>
    <text x="74" y="188" fill="#0E7490" font-size="32" font-weight="720" letter-spacing="0">Software Engineer</text>
    <text x="74" y="232" fill="#1E293B" font-size="27" font-weight="660" letter-spacing="0">Backend • Cloud • Distributed Systems</text>
    <text x="76" y="270" fill="#475569" font-size="18" font-weight="520" letter-spacing="0">Cloud platforms, distributed systems, and open-source engineering.</text>
  </g>

  <g transform="translate(648 48)" filter="url(#softShadow)">
    <rect x="0" y="0" width="486" height="264" rx="28" fill="#FFFFFF" stroke="#D8E1EE"/>
    <rect x="24" y="24" width="438" height="216" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>

    <g transform="translate(58 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="0" y="0" width="346" height="54" rx="18" fill="url(#stackTop)"/>
      <text x="26" y="34" fill="#F8FAFC" font-size="18" font-weight="760">Systems Canvas</text>
      <rect x="232" y="18" width="86" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.14"/>

      <g transform="translate(0 78)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="154" height="56" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
        <rect x="14" y="15" width="6" height="26" rx="3" fill="#0891B2"/>
        <text x="34" y="29" fill="#0F172A" font-size="16" font-weight="760">API Layer</text>
        <text x="34" y="46" fill="#64748B" font-size="13" font-weight="560">contracts</text>
      </g>

      <g transform="translate(192 78)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="154" height="56" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
        <rect x="14" y="15" width="6" height="26" rx="3" fill="#2563EB"/>
        <text x="34" y="29" fill="#0F172A" font-size="16" font-weight="760">Services</text>
        <text x="34" y="46" fill="#64748B" font-size="13" font-weight="560">workflows</text>
      </g>

      <g transform="translate(0 154)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="154" height="56" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
        <rect x="14" y="15" width="6" height="26" rx="3" fill="#4F46E5"/>
        <text x="34" y="29" fill="#0F172A" font-size="16" font-weight="760">State</text>
        <text x="34" y="46" fill="#64748B" font-size="13" font-weight="560">records</text>
      </g>

      <g transform="translate(192 154)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="154" height="56" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
        <rect x="14" y="15" width="6" height="26" rx="3" fill="#0284C7"/>
        <text x="34" y="29" fill="#0F172A" font-size="16" font-weight="760">Cloud</text>
        <text x="34" y="46" fill="#64748B" font-size="13" font-weight="560">platforms</text>
      </g>

      <path d="M154 106H192" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M77 134V154" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M269 134V154" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M154 182H192" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <g opacity="0.95">
    <path d="M1012 40H1140" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M1058 56H1140" stroke="#0891B2" stroke-width="3" stroke-linecap="round"/>
    <path d="M1096 72H1140" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
